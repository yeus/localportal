<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Encrypted Lectures</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="sidebar-toggle" aria-label="Open sidebar" tabindex="0">
      <!-- Hamburger icon -->
      <svg width="32" height="32" viewBox="0 0 32 32">
        <rect y="7" width="24" height="3" rx="1.5" fill="#667eea" />
        <rect y="14" width="24" height="3" rx="1.5" fill="#667eea" />
        <rect y="21" width="24" height="3" rx="1.5" fill="#667eea" />
      </svg>
    </div>
    <div id="sidebar-backdrop"></div>
    <div class="container">
      <nav id="sidebar"></nav>
      <main id="content">
        <div id="pw-prompt" class="prompt">
          <div class="intro">
            <p id="prompt-intro"></p>
          </div>
          <div id="pw-error" class="pw-error" style="display: none"></div>
          <input type="password" id="pw" />
          <button id="unlock"></button>
        </div>
        <div id="lecture-wrapper" style="display: none; padding: 1rem">
          Please unlock lectures.
        </div>
      </main>
    </div>

    <script>
      // ==== TEXT CONFIGURATION ====
      const texts = {
        welcomeMessage: "👋 Welcome to your encrypted lectures!",
        promptIntro:
          "🔒 Welcome! Please enter the password to unlock the lectures.",
        promptPlaceholder: "Enter password",
        unlockButton: "Unlock",
        pwErrorIncorrect: "❌ Incorrect password. Please try again.",
        sidebarNoteLocked:
          "🔒 Links to lectures will appear here once you unlock the page.",
        sidebarNoteNoLectures: "🔐 Unlock to see available lectures.",
        logoutButton: "Log out",
      };

      console.log("[startup] script loaded");

      let currentPassword = null;

      async function deriveKey(pw, salt) {
        const mat = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(pw),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
          mat,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      }

      async function decryptBlob(blob, pw) {
        const buf = await blob.arrayBuffer();
        const arr = new Uint8Array(buf);
        const salt = arr.slice(0, 16),
          iv = arr.slice(16, 28),
          ct = arr.slice(28);
        const key = await deriveKey(pw, salt);
        const pt = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv },
          key,
          ct
        );
        return new TextDecoder().decode(pt);
      }

      window.addEventListener("DOMContentLoaded", async () => {
        // === ELEMENT REFERENCES ===
        const sidebarToggle = document.getElementById("sidebar-toggle");
        const sidebar = document.getElementById("sidebar");
        const sidebarBackdrop = document.getElementById("sidebar-backdrop");
        const promptEl = document.getElementById("pw-prompt");
        const wrapper = document.getElementById("lecture-wrapper");
        const pwInput = document.getElementById("pw");
        const unlockBtn = document.getElementById("unlock");
        const errEl = document.getElementById("pw-error");
        const promptIntroEl = document.getElementById("prompt-intro");

        // === INITIAL TEXT SETUP ===
        promptIntroEl.textContent = texts.promptIntro;
        pwInput.placeholder = texts.promptPlaceholder;
        unlockBtn.textContent = texts.unlockButton;

        // === SIDEBAR TOGGLE ===
        function openSidebar() {
          sidebar.classList.add("open");
          sidebarBackdrop.classList.add("open");
          document.body.style.overflow = "hidden";
        }
        function closeSidebar() {
          sidebar.classList.remove("open");
          sidebarBackdrop.classList.remove("open");
          document.body.style.overflow = "";
        }
        sidebarToggle.addEventListener("click", openSidebar);
        sidebarToggle.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") openSidebar();
        });
        sidebarBackdrop.addEventListener("click", closeSidebar);
        sidebar.addEventListener("click", (e) => {
          if (window.innerWidth <= 768 && e.target.tagName === "A")
            closeSidebar();
        });
        window.addEventListener("resize", () => {
          if (window.innerWidth > 768) closeSidebar();
        });

        // === PASSWORD PROMPT HANDLING ===
        function showPwError(msg) {
          errEl.textContent = msg;
          errEl.style.display = "block";
          setTimeout(() => {
            errEl.classList.add("hide");
            setTimeout(() => {
              errEl.style.display = "none";
              errEl.classList.remove("hide");
            }, 500);
          }, 3000);
        }
        pwInput.addEventListener("input", () => {
          errEl.style.display = "none";
        });

        async function tryLoad() {
          const stored = localStorage.getItem("lecturePW");
          if (!stored) {
            showPrompt();
            return;
          }
          try {
            const manifest = await fetch("manifest.json").then((r) => r.json());
            const blob = await fetch(`lectures/${manifest[0].id}.enc`).then(
              (r) => r.blob()
            );
            await decryptBlob(blob, stored);
            onUnlock(stored);
          } catch {
            localStorage.removeItem("lecturePW");
            showPrompt();
            showPwError(texts.pwErrorIncorrect);
          }
        }

        function showPrompt() {
          sidebar.innerHTML = `<div class="sidebar-note">${texts.sidebarNoteLocked}</div>`;
          promptEl.style.display = "flex";
          wrapper.style.display = "none";
        }

        // === ON UNLOCK ===
        function onUnlock(pw) {
          currentPassword = pw;
          promptEl.style.display = "none";
          wrapper.style.display = "";
          loadSidebarAndLectures(pw);

          // if user landed on e.g. index.html#foo, load that; otherwise default
          const first = location.hash.slice(1) || "introduction";
          loadLecture(first, pw);
        }

        unlockBtn.onclick = async () => {
          const pw = pwInput.value;
          localStorage.setItem("lecturePW", pw);
          await tryLoad();
        };
        pwInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") unlockBtn.click();
        });

        // === SIDEBAR & LECTURE LOADING ===
        async function loadSidebarAndLectures(pw) {
          sidebar.innerHTML = "";
          // logout
          const btn = document.createElement("button");
          btn.textContent = texts.logoutButton;
          btn.className = "sidebar-logout";
          btn.onclick = () => {
            localStorage.removeItem("lecturePW");
            location.reload();
          };
          sidebar.appendChild(btn);
          // welcome & click-to-intro
          const welcome = document.createElement("div");
          welcome.className = "sidebar-intro";
          welcome.textContent = texts.welcomeMessage;
          // ← set hash to default; our hashchange listener will load it
          welcome.onclick = () => {
            location.hash = "#introduction";
          };
          sidebar.appendChild(welcome);

          let manifest;
          try {
            manifest = await fetch("manifest.json").then((r) => r.json());
          } catch {
            manifest = [];
          }

          manifest = manifest.filter((item) => item.id !== "introduction");

          if (!manifest.length) {
            sidebar.appendChild(
              Object.assign(document.createElement("div"), {
                className: "sidebar-note",
                textContent: texts.sidebarNoteNoLectures,
              })
            );
            return;
          }

          manifest.sort((a, b) =>
            (a.title || a.id).localeCompare(b.title || b.id)
          );
          manifest.forEach((item) => {
            const a = document.createElement("a");
            a.href = `#${item.id}`; // ← set hash
            a.textContent = item.title || item.id;
            // no need for onclick; hashchange will fire
            sidebar.appendChild(a);
          });
        }

        // listen for hash changes (back/forward or link click)
        window.addEventListener("hashchange", () => {
          const id = location.hash.slice(1);
          if (id && currentPassword) {
            loadLecture(id, currentPassword);
          }
        });

        async function loadLecture(id, pw) {
          try {
            const blob = await fetch(`lectures/${id}.enc`).then((r) =>
              r.blob()
            );
            const html = await decryptBlob(blob, pw);
            document.getElementById("lecture-wrapper").innerHTML = html;
          } catch (err) {
            console.error("Failed loading lecture", id, err);
          }
        }

        await tryLoad();
      });
    </script>
  </body>
</html>
