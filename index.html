<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Encrypted Lectures</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    data-owner="Professor Meschede"
    data-welcome="👋 Welcome to your encrypted lectures!"
  >
    <div class="container">
      <nav id="sidebar"></nav>
      <main id="content">
        <div id="pw-prompt" class="prompt">
          <div class="intro">
            <p>🔒 Welcome! Please enter the password to unlock the lectures.</p>
          </div>
          <input type="password" id="pw" placeholder="Enter password" />
          <button id="unlock">Unlock</button>
        </div>
        <div id="lecture-wrapper" style="display: none; padding: 1rem">
          Please unlock lectures.
        </div>
      </main>
    </div>

    <script>
      console.log("[startup] script loaded");

      async function deriveKey(pw, salt) {
        console.log("[deriveKey] pw:", pw, "salt:", new Uint8Array(salt));
        const mat = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(pw),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt,
            iterations: 250000,
            hash: "SHA-256",
          },
          mat,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      }

      async function decryptBlob(blob, pw) {
        console.log("[decryptBlob] start");
        const buf = await blob.arrayBuffer();
        const arr = new Uint8Array(buf);
        const salt = arr.slice(0, 16),
          iv = arr.slice(16, 28),
          ct = arr.slice(28);
        console.log(
          "[decryptBlob] salt, iv, ct lengths:",
          salt.length,
          iv.length,
          ct.length
        );
        const key = await deriveKey(pw, salt);
        const pt = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv },
          key,
          ct
        );
        const text = new TextDecoder().decode(pt);
        console.log("[decryptBlob] success, plaintext length:", text.length);
        return text;
      }

      window.addEventListener("DOMContentLoaded", async () => {
        console.log("[DOMContentLoaded] start");

        // customization vars
        const owner = document.body.dataset.owner;
        const welcomeMsg = document.body.dataset.welcome;

        const promptEl = document.getElementById("pw-prompt");
        const wrapper = document.getElementById("lecture-wrapper");
        const pwInput = document.getElementById("pw");
        const unlockBtn = document.getElementById("unlock");
        const sidebar = document.getElementById("sidebar");

        async function tryLoad() {
          console.log("[tryLoad] checking stored pw...");
          const pw = localStorage.getItem("lecturePW");
          console.log("[tryLoad] got pw from storage:", pw ? "***" : null);
          if (!pw) {
            console.log("[tryLoad] no pw, showing prompt");
            showPrompt();
            return;
          }
          try {
            console.log("[tryLoad] fetching manifest.json");
            const manifest = await fetch("manifest.json").then((r) => r.json());
            console.log("[tryLoad] manifest:", manifest);
            const blob = await fetch(`lectures/${manifest[0].id}.enc`).then(
              (r) => r.blob()
            );
            console.log("[tryLoad] fetched blob for", manifest[0].id);
            await decryptBlob(blob, pw);
            console.log("[tryLoad] pw OK, unlocking");
            onUnlock(pw);
          } catch (err) {
            console.error("[tryLoad] error:", err);
            localStorage.removeItem("lecturePW");
            showPrompt();
          }
        }

        function showPrompt() {
          console.log("[showPrompt] display prompt");
          // sidebar placeholder
          sidebar.innerHTML = `
          <div class="sidebar-note">
            🔒 Links to lectures will appear here once you unlock the page.
          </div>`;
          promptEl.style.display = "flex";
          wrapper.style.display = "none";
        }

        function onUnlock(pw) {
          console.log("[onUnlock] hiding prompt, showing wrapper");
          promptEl.style.display = "none";
          wrapper.style.display = "";
          loadSidebarAndLectures(pw);
          loadLecture("introduction", pw); // auto-load intro page
        }

        unlockBtn.onclick = async () => {
          console.log("[unlockBtn.onclick] clicked, pw=", pwInput.value);
          localStorage.setItem("lecturePW", pwInput.value);
          await tryLoad();
        };

        async function loadSidebarAndLectures(pw) {
          console.log("[loadSidebarAndLectures] start");
          sidebar.innerHTML = "";

          // logout button
          const logoutBtn = document.createElement("button");
          logoutBtn.textContent = "Log out";
          logoutBtn.className = "sidebar-logout";
          logoutBtn.onclick = () => {
            localStorage.removeItem("lecturePW");
            location.reload();
          };
          sidebar.appendChild(logoutBtn);

          // personalized greeting
          const welcome = document.createElement("div");
          welcome.className = "sidebar-intro";
          welcome.textContent = `${welcomeMsg} (by ${owner})`;
          sidebar.appendChild(welcome);
          console.log("[loadSidebarAndLectures] added personalized welcome");

          try {
            const manifest = await fetch("manifest.json").then((r) => r.json());
            console.log("[loadSidebarAndLectures] manifest:", manifest);

            if (!manifest.length) {
              console.log("[loadSidebarAndLectures] no lectures in manifest");
              const note = document.createElement("div");
              note.className = "sidebar-note";
              note.textContent = "🔐 Unlock to see available lectures.";
              sidebar.appendChild(note);
              return;
            }

            manifest.forEach((item) => {
              console.log("[loadSidebarAndLectures] adding link for", item.id);
              const a = document.createElement("a");
              a.href = "#";
              a.textContent = item.title || item.id;
              a.onclick = () => {
                console.log("[lecture link clicked]", item.id);
                loadLecture(item.id, pw);
              };
              sidebar.appendChild(a);
            });
          } catch (err) {
            console.error(
              "[loadSidebarAndLectures] error fetching manifest:",
              err
            );
          }
        }

        async function loadLecture(id, pw) {
          console.log("[loadLecture] loading", id);
          try {
            const blob = await fetch(`lectures/${id}.enc`).then((r) =>
              r.blob()
            );
            const html = await decryptBlob(blob, pw);
            document.getElementById("lecture-wrapper").innerHTML = html;
            console.log("[loadLecture] rendered lecture", id);
          } catch (err) {
            console.error("[loadLecture] failed to load lecture", id, err);
          }
        }

        await tryLoad();
      });
    </script>
  </body>
</html>
