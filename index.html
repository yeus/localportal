<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Lecture Platform</title>
    <link rel="stylesheet" href="style.css">
    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2><i class="bi bi-book"></i> Course Lectures</h2>
            </div>
            <ul class="lecture-list" id="lectureList">
                <li>
                    <a href="#" data-lecture="introduction" class="lecture-link active">
                        <i class="bi bi-play-circle"></i>
                        Introduction
                    </a>
                </li>
                <li>
                    <a href="#" data-lecture="getting-started" class="lecture-link">
                        <i class="bi bi-gear"></i>
                        Getting Started
                    </a>
                </li>
                <li>
                    <a href="#" data-lecture="advanced-topics" class="lecture-link">
                        <i class="bi bi-lightning"></i>
                        Advanced Topics
                    </a>
                </li>
                <li>
                    <a href="#" data-lecture="practical-exercises" class="lecture-link">
                        <i class="bi bi-pencil-square"></i>
                        Practical Exercises
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="content-header">
                <h1 id="currentLectureTitle">Loading...</h1>
                <div class="content-meta">
                    <span id="lastUpdated"></span>
                </div>
            </div>
            
            <div class="content-body">
                <div id="loadingSpinner" class="loading">
                    <i class="bi bi-arrow-clockwise"></i>
                    Loading lecture content...
                </div>
                
                <div id="errorMessage" class="error-message" style="display: none;">
                    <i class="bi bi-exclamation-triangle"></i>
                    <span>Failed to load lecture content. Please check if the file exists.</span>
                </div>
                
                <article id="lectureContent" class="lecture-content"></article>
            </div>
        </main>
    </div>

    <script>
        class LectureApp {
            constructor() {
                this.currentLecture = 'introduction';
                this.lectures = {
                    'introduction': 'Introduction',
                    'getting-started': 'Getting Started',
                    'advanced-topics': 'Advanced Topics',
                    'practical-exercises': 'Practical Exercises'
                };
                this.init();
            }

            init() {
                // Configure marked.js
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            try {
                                return hljs.highlight(code, { language: lang }).value;
                            } catch (err) {
                                console.error('Highlight.js error:', err);
                            }
                        }
                        return hljs.highlightAuto(code).value;
                    },
                    breaks: true,
                    gfm: true
                });

                this.bindEvents();
                this.loadLecture(this.currentLecture);
            }

            bindEvents() {
                const lectureLinks = document.querySelectorAll('.lecture-link');
                lectureLinks.forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const lectureId = e.currentTarget.getAttribute('data-lecture');
                        this.loadLecture(lectureId);
                        this.setActiveLink(e.currentTarget);
                    });
                });
            }

            setActiveLink(activeLink) {
                // Remove active class from all links
                document.querySelectorAll('.lecture-link').forEach(link => {
                    link.classList.remove('active');
                });
                // Add active class to clicked link
                activeLink.classList.add('active');
            }

            async loadLecture(lectureId) {
                this.currentLecture = lectureId;
                const contentElement = document.getElementById('lectureContent');
                const loadingElement = document.getElementById('loadingSpinner');
                const errorElement = document.getElementById('errorMessage');
                const titleElement = document.getElementById('currentLectureTitle');

                // Show loading state
                loadingElement.style.display = 'block';
                errorElement.style.display = 'none';
                contentElement.style.display = 'none';

                try {
                    const response = await fetch(`lectures/${lectureId}.md`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const markdownContent = await response.text();
                    const htmlContent = marked.parse(markdownContent);

                    // Update content
                    contentElement.innerHTML = htmlContent;
                    titleElement.textContent = this.lectures[lectureId] || 'Unknown Lecture';
                    
                    // Update last modified info
                    const lastModified = response.headers.get('last-modified');
                    if (lastModified) {
                        document.getElementById('lastUpdated').textContent = 
                            `Last updated: ${new Date(lastModified).toLocaleDateString()}`;
                    }

                    // Hide loading and show content
                    loadingElement.style.display = 'none';
                    contentElement.style.display = 'block';

                    // Re-highlight code blocks
                    contentElement.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });

                    // Handle video embeds
                    this.processVideoEmbeds(contentElement);

                } catch (error) {
                    console.error('Error loading lecture:', error);
                    
                    // Show error message
                    loadingElement.style.display = 'none';
                    errorElement.style.display = 'block';
                    titleElement.textContent = 'Error Loading Lecture';
                    
                    // Update error message with specific details
                    errorElement.querySelector('span').textContent = 
                        `Failed to load lecture content: ${error.message}`;
                }
            }

            processVideoEmbeds(contentElement) {
                // Process YouTube video links
                const youtubeRegex = /https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/g;
                
                contentElement.querySelectorAll('a').forEach(link => {
                    const href = link.getAttribute('href');
                    const match = youtubeRegex.exec(href);
                    
                    if (match) {
                        const videoId = match[1];
                        const iframe = document.createElement('div');
                        iframe.className = 'video-embed';
                        iframe.innerHTML = `
                            <iframe 
                                src="https://www.youtube.com/embed/${videoId}" 
                                frameborder="0" 
                                allowfullscreen>
                            </iframe>
                        `;
                        link.parentNode.replaceChild(iframe, link);
                    }
                });
            }
        }

        // Initialize the application when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new LectureApp();
        });
    </script>
</body>
</html>
